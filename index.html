<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #525659;
            font-family: Arial, sans-serif;
        }

        .document {
            width: 100%;
            padding: 30px 0;
        }

        .page {
            width: 794px;
            min-height: 1123px;
            margin: 0 auto 30px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.35);
            padding: 30px;
        }

        .filename {
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
            color: #222;
            word-break: break-word;
        }

        .page img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* Mobile */
        @media (max-width: 850px) {
            body {
                background: #f2f2f2;
            }

            .document {
                padding: 10px 0;
            }

            .page {
                width: 96%;
                min-height: auto;
                padding: 15px;
                margin-bottom: 15px;
                box-shadow: 0 1px 5px rgba(0,0,0,0.2);
            }

            .filename {
                font-size: 18px;
                margin-bottom: 12px;
            }

            .page img {
                width: 100%;
            }
        }

        /* Print */
        @media print {
            body {
                background: white;
            }

            .document {
                padding: 0;
            }

            .page {
                width: 100%;
                min-height: 100vh;
                margin: 0;
                padding: 20px;
                box-shadow: none;
                page-break-after: always;
            }
        }
    </style>
</head>

<body>

<div class="document">

    <div class="page">
        <div class="filename">Diet Plan</div>
        <img src="Diet Plan.jpeg" alt="Diet Plan">
    </div>

    <div class="page">
        <div class="filename">Breakfast</div>
        <img src="Breakfast.jpg" alt="Breakfast">
    </div>

    <div class="page">
        <div class="filename">Lunch</div>
        <img src="Lunch.jpeg" alt="Lunch">
    </div>

    <div class="page">
        <div class="filename">Dinner</div>
        <img src="Dinner.jpg" alt="Dinner">
    </div>

</div>

</body>
</html>
